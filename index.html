<title>村庄</title>
<style>
/* ============ 村庄文游 · 瑞士风 App 样式（v2） ============
   纸白 #F7F6F2 / 纯黑 #191813 / 单一红 #E03328
   8pt 网格 · 字级四档（大标/小标/内文/注释）· 触控 ≥48px */

:root {
  --paper: #F7F6F2;
  --surface: #FFFFFF;
  --ink: #191813;
  --ink-2: rgba(25, 24, 19, .64);
  --ink-3: rgba(25, 24, 19, .42);
  --hair: #E6E3DB;
  --wash: #EFEDE6;
  --red: #D9291C;
  --red-deep: #B72217;
  --red-wash: #FAEBE9;
  --ease: cubic-bezier(.32, .72, .24, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: var(--paper); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background: var(--paper); color: var(--ink);
  max-width: 480px; margin: 0 auto; min-height: 100dvh;
  display: flex; flex-direction: column;
  font-size: 15px; line-height: 1.7;
  -webkit-user-select: none; user-select: none;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overscroll-behavior-y: none;
}
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
#app { display: flex; flex-direction: column; min-height: 100dvh; }

/* ---------- 顶栏 ---------- */
#statusbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--hair);
  padding: 12px 20px; padding-top: calc(12px + env(safe-area-inset-top));
  display: flex; align-items: center; gap: 12px;
}
#avatar {
  width: 40px; height: 40px; background: var(--ink); color: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700; flex: none;
}
.pinfo { flex: 1; min-width: 0; }
.pname { font-weight: 700; font-size: 16px; letter-spacing: .02em; line-height: 1.3; }
.statline {
  display: flex; flex-wrap: wrap; gap: 2px 10px;
  font-size: 12px; color: var(--ink-2); margin-top: 3px;
  font-variant-numeric: tabular-nums;
}
.statline .st:first-child { color: var(--ink); font-weight: 700; }
.statline .st:first-child::before {
  content: ""; display: inline-block; width: 6px; height: 6px;
  background: var(--red); margin-right: 7px; vertical-align: 1px;
}

/* ---------- 主区 ---------- */
#main { flex: 1; padding: 20px 20px 100px; overflow-wrap: break-word; }
#main > * { animation: rise .18s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- 底栏 ---------- */
#tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 20;
  display: flex; background: var(--surface); border-top: 1px solid var(--hair);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  flex: 1; text-align: center; padding: 9px 0 8px;
  color: var(--ink-3); font-size: 11px; font-weight: 500;
  cursor: pointer; position: relative;
  transition: color .15s;
}
.tab .ico { display: block; margin: 0 auto 3px; width: 24px; height: 24px; }
.tab .ico svg { display: block; width: 100%; height: 100%; stroke: currentColor; }
.tab.active { color: var(--ink); font-weight: 700; }
.tab.active::before {
  content: ""; position: absolute; top: -1px; left: 50%; transform: translateX(-50%);
  width: 24px; height: 3px; background: var(--red);
}

/* ---------- 标题层级 ---------- */
.sec-title {
  font-size: 12px; font-weight: 700; letter-spacing: .14em;
  color: var(--ink-2); margin: 28px 0 12px;
  display: flex; align-items: center; gap: 8px;
}
.sec-title::before { content: ""; width: 6px; height: 6px; background: var(--red); flex: none; }
.sec-sub {
  font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--ink-2); margin: 20px 0 8px;
  display: flex; align-items: center; gap: 8px;
}
.sec-sub::before { content: ""; width: 6px; height: 6px; background: var(--red); flex: none; }
.dim { color: var(--ink-3); font-size: 13px; }
.back {
  background: none; border: none; color: var(--ink-2); font-size: 14px; font-weight: 500;
  margin: 0 0 4px -8px; cursor: pointer; padding: 12px 8px; min-height: 44px;
  transition: color .15s;
}
.back:active { color: var(--ink); }

/* ---------- 卡片 ---------- */
.card, .zone {
  background: var(--surface); border: 1px solid var(--hair);
  padding: 16px; margin-bottom: 10px;
}
.row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.li { font-size: 15px; margin: 6px 0; line-height: 1.75; }

/* ---------- 地点格 ---------- */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cell {
  background: var(--surface); border: 1px solid var(--hair);
  padding: 16px 8px; min-height: 76px;
  font-size: 15px; font-weight: 500; color: var(--ink);
  cursor: pointer; display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center;
  transition: background .12s, transform .12s;
}
.cell:active { background: var(--wash); transform: scale(.97); }
.pwho { font-size: 11px; color: var(--ink-3); font-weight: 400; line-height: 1.4; }
.place-desc { font-size: 14px; color: var(--ink-2); margin-bottom: 16px; line-height: 1.75; }

/* ---------- NPC 卡 ---------- */
.npc-card {
  width: 100%; text-align: left; background: var(--surface);
  border: 1px solid var(--hair); padding: 14px 16px;
  margin-bottom: 10px; cursor: pointer;
  display: flex; flex-direction: column; gap: 3px;
  transition: background .12s, transform .12s;
  position: relative;
}
.npc-card:active { background: var(--wash); transform: scale(.985); }
.npc-card::after {
  content: "›"; position: absolute; right: 14px; top: 50%;
  transform: translateY(-52%); color: var(--ink-3); font-size: 20px; line-height: 1;
}
.nname { font-weight: 700; font-size: 16px; }
.star-mark { color: var(--red); font-size: 13px; margin-left: 4px; vertical-align: 1px; }
.njob { font-size: 12px; color: var(--ink-2); }
.nrel { font-size: 13px; color: var(--ink-2); margin-top: 2px; }

/* ---------- 播报流 ---------- */
.feed-wrap { display: flex; flex-direction: column; gap: 10px; }
.feed {
  background: var(--surface); border: 1px solid var(--hair); border-left-width: 3px; border-left-color: var(--hair);
  padding: 12px 14px; font-size: 15px; line-height: 1.75;
}
.feed.you { border-left-color: var(--red); }
.feed.major { border-left-color: var(--ink); }
.fmeta {
  font-size: 11px; color: var(--ink-3); margin-bottom: 5px;
  letter-spacing: .05em; font-variant-numeric: tabular-nums;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.ftag {
  font-size: 10px; font-weight: 700; letter-spacing: .06em;
  border: 1px solid currentColor; border-radius: 2px; padding: 1px 6px;
}
.ftag.you { color: var(--red); }
.ftag.major { color: var(--ink-2); }
.feed-hint {
  font-size: 13px; color: var(--ink-2);
  background: var(--wash); border: 1px solid var(--hair); padding: 12px 14px;
}
.feed-more {
  width: 100%; background: var(--surface); border: none; box-shadow: inset 0 0 0 1.5px var(--hair);
  color: var(--ink-2); font-size: 13px; font-weight: 500; padding: 12px; min-height: 44px;
  cursor: pointer; letter-spacing: .02em;
  transition: background .12s, transform .12s;
}
.feed-more:active { background: var(--wash); transform: scale(.985); }
#feed-sec { scroll-margin-top: 72px; }
#main > .sec-title:first-child { margin-top: 4px; }
.nm { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 3px; cursor: pointer; }
.night-note {
  font-size: 13.5px; line-height: 1.75; color: var(--paper);
  background: var(--ink); padding: 12px 14px; margin-bottom: 12px;
}

/* ---------- 按钮 ---------- */
.btn {
  background: var(--ink); color: var(--surface); border: none;
  padding: 13px 16px; min-height: 48px; font-size: 15px; font-weight: 500;
  cursor: pointer; letter-spacing: .02em;
  transition: background .12s, transform .12s;
}
.btn:active { background: #000; transform: scale(.97); }
.btn.gold { background: var(--red); }
.btn.gold:active { background: var(--red-deep); }
.btn.warn { background: transparent; color: var(--red); box-shadow: inset 0 0 0 1.5px var(--red); }
.btn.warn:active { background: var(--red-wash); }
.btn.dis { background: var(--wash); color: var(--ink-3); pointer-events: none; }
.btn.line { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn.line:active { background: var(--wash); }
.btn.line.dis { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--hair); color: var(--ink-3); }
.btn.big { padding: 15px 24px; min-height: 54px; font-size: 16px; font-weight: 700; }
.btn.ib { flex: 1; min-width: 0; }
.actrow2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0; }
.actrow2 .btn:only-child { grid-column: 1 / -1; }
.tb { flex: 1 1 45%; }

/* ---------- 档案弹窗 ---------- */
#modal-mask {
  position: fixed; inset: 0; background: rgba(20, 19, 16, .45);
  display: none; z-index: 40; align-items: flex-end; justify-content: center;
}
#modal-mask.show { display: flex; animation: fade .2s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
#modal {
  background: var(--surface); width: 100%; max-width: 480px; max-height: 86dvh;
  padding: 14px 20px calc(28px + env(safe-area-inset-bottom)); overflow-y: auto;
  position: relative; animation: sheet .26s var(--ease) both;
}
@keyframes sheet { from { transform: translateY(100%); } to { transform: none; } }
#modal::before {
  content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  width: 36px; height: 4px; border-radius: 2px; background: #D6D2C8;
}
.modal-close {
  position: absolute; top: 16px; right: 14px; background: none; border: none;
  font-size: 16px; color: var(--ink-3); cursor: pointer; padding: 6px; line-height: 1;
  transition: color .15s;
}
.modal-close:active { color: var(--ink); }
#modal-title {
  font-size: 12px; font-weight: 700; letter-spacing: .14em;
  color: var(--ink-2); margin: 10px 0 6px;
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 4px; gap: 12px; }
.sheet-name { font-size: 22px; font-weight: 700; letter-spacing: .02em; }
.star {
  background: none; box-shadow: inset 0 0 0 1.5px var(--hair); color: var(--ink-2);
  border: none; padding: 9px 14px; min-height: 40px; font-size: 13px; font-weight: 500; cursor: pointer;
  transition: all .15s;
}
.star.on { background: var(--red); box-shadow: none; color: #fff; font-weight: 700; }
.star:active { transform: scale(.96); }
.bio { font-size: 15px; line-height: 1.8; margin: 10px 0; color: var(--ink); }
.secret {
  font-size: 13.5px; line-height: 1.7; color: var(--ink-2);
  background: var(--wash); padding: 10px 12px; margin: 8px 0;
}
.relbar { font-size: 13px; color: var(--ink-2); margin: 8px 0; font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--wash); margin-top: 5px; }
.bar > div { height: 100%; background: var(--red); transition: width .3s var(--ease); }
.line { font-size: 15px; line-height: 1.85; margin: 8px 0; }

/* ---------- 背包 / 编年史 ---------- */
.bag { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.bag-item {
  background: var(--surface); border: 1px solid var(--hair);
  padding: 12px 14px; font-size: 15px; cursor: pointer; min-height: 78px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  transition: background .12s, transform .12s;
}
.bag-item:active { background: var(--wash); transform: scale(.97); }
.bag-item b { font-size: 15px; }
.chron {
  background: var(--surface); border: 1px solid var(--hair);
  padding: 12px 14px; margin-bottom: 10px; font-size: 15px; cursor: pointer;
  transition: background .12s, transform .12s;
}
.chron:active { background: var(--wash); transform: scale(.985); }
.trade { margin-top: 4px; }

/* ---------- 启动页 ---------- */
.boot {
  display: flex; flex-direction: column; align-items: stretch; justify-content: center;
  flex: 1; padding: 40px 8px 24px;
}
.boot-title {
  font-size: 40px; font-weight: 800; letter-spacing: .28em;
  color: var(--ink); margin: 0 0 14px; text-indent: .28em; text-align: center;
}
.boot-sub {
  font-size: 12px; color: var(--ink-2); letter-spacing: .18em;
  margin-bottom: 36px; text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.boot-sub::before, .boot-sub::after { content: ""; width: 24px; height: 1px; background: var(--hair); }
.boot-box { border-top: 2px solid var(--ink); padding-top: 20px; margin-bottom: 32px; }
.boot-txt { font-size: 15px; line-height: 2.1; color: var(--ink); }
.boot-actions { display: flex; flex-direction: column; gap: 10px; }
.boot-actions .btn { width: 100%; }
.boot-note { font-size: 12px; color: var(--ink-3); text-align: center; margin-top: 12px; }

/* ---------- toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(16px);
  background: var(--ink); color: var(--surface); font-size: 13.5px; border-radius: 999px;
  padding: 10px 20px; opacity: 0; transition: all .25s var(--ease); pointer-events: none; z-index: 60;
  max-width: 86vw; text-align: center; line-height: 1.6;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 动效降级 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
<div id="app">
  <div id="statusbar">
    <div class="avatar" id="avatar">G</div>
    <div class="pinfo">
      <div class="pname">Gloria</div>
      <div class="statline" id="statline"></div>
    </div>
  </div>
  <div id="main"></div>
  <div id="tabbar">
    <div class="tab active" data-t="village"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg></span>村庄</div>
    <div class="tab" data-t="home"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-6h4v6"/></svg></span>家</div>
    <div class="tab" data-t="explore"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 19L10 6l4 7 3-4 4 10z"/></svg></span>探险</div>
    <div class="tab" data-t="settings"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="#fff"/><circle cx="15" cy="12" r="2" fill="#fff"/><circle cx="8" cy="17" r="2" fill="#fff"/></svg></span>设定</div>

  </div>
  <div id="toast"></div>
</div>
<script>
/* ============ 村庄文游 · 数据层（第一批） ============ */
/* NPC 档案、台词池、微事件池、交易表。所有文本遵循 docs §8.6 防八股铁律 */

const NODE_NAMES = ['上午', '中午', '下午', '上半夜', '下半夜'];
const DAY_NODES = 3;      // 白天节点数
const MAX_ENERGY = 20;

/* 地点：outdoor=true 时打闹有骑士应激风险 */
const PLACES = {
  plaza:    { name: '广场',   outdoor: true,  desc: '村子中心，井也在这。骑士白天多站在这里。' },
  well:     { name: '井',     outdoor: true,  desc: '全村的水都从这来。打水不费力气。' },
  field:    { name: '农田',   outdoor: true,  desc: '四片田。Gloria 一片，Alice 两片，Levi 一片。' },
  farm:     { name: '养殖场', outdoor: true,  desc: 'Levi 的羊都在这。羊毛和奶制品的稳定来源。' },
  church:   { name: '教堂',   outdoor: false, desc: 'Vivienne 的地盘。可以祈祷。' },
  library:  { name: '图书馆', outdoor: false, desc: 'Leo 守着。可以借书、坐一天学习。' },
  forge:    { name: '锻造室', outdoor: false, desc: 'Bess 的锻造室，热得烤人。兵器比自造的好。' },
  bakery:   { name: '烘焙坊', outdoor: false, desc: 'Olivia 的炉子从早烧到晚。' },
  alchemy:  { name: '炼药房', outdoor: false, desc: 'Isabel 常年躺在店里的沙发上。夜里也睡这。' },
  belltower:{ name: '钟楼',   outdoor: false, desc: '白天是 Jacob 的工坊。夜里是射击位。' },
  home:     { name: '你家',   outdoor: false, desc: 'Gloria 自建的房子。Asher 每晚睡这。' },
};

/* NPC：loc 数组 = 5 个节点各自的位置（'home'=在自己家，不可访）
   nightStay: 'sofa'=夜宿炼药房（可夜访）；belltower 随机夜宿在引擎里掷骰 */
const NPCS = [
  { id: 'vivienne', name: 'Vivienne', age: 30, job: '牧师', initF: 15,
    bio: '村里的牧师。傲慢，直接，欲望从不遮掩。全村的忏悔都进她的耳朵，所以她什么都知道。',
    secretHint: '她知道的，比你告诉她的多。',
    loc: ['church', 'church', 'church', 'home', 'home'],
    noTrade: true,
    chat: { low: [
      '早啊孩子。今天的风真大，愿主保佑你平安。',
      '祈祷书放这里。有需要随时可以来。',
      '村里人都心善，有什么难处说出来就好。',
      '猎户活儿累人，教堂常备着水。',
      '祈祷后有空位坐。',
      '风大了，小心着凉。',
      '新一天平安。',
    ], mid: [
      '今天祈祷书放错了地方，害我找了半天。',
      '北边的风好像大了，出门记得加件衣服。',
      '我备了点草药在你家门口。防蚊虫的。',
      '祈祷时我总分心想到你的事。抱歉，孩子。',
      'Lee 今早在画你的木矛。有意思。',
      '夜里怪声比上个月多两成。你离林子远些。',
      'Asher 膝盖的膏药该换了。',
      '红菌菇采多了分你半筐。',
      '你送来的兔皮真好，垫子做成了。',
      '昨晚动静真大，吵得我头疼。',
      '看着你就觉得你肯定没睡够。',
    ], high: [
      '你觉得该不该把井水引去西边。村里人都吵翻了。',
      '别急着走。多坐会儿，我有新故事讲。',
      '累坏了。肩膀都僵了。帮我捏捏好不好。',
      '西边的路要不要加道围栏？老有人抱怨怪物挠花了柱子，看着烦。',
      '别急着走了。再说会儿话。',
      '这账本看得我眼花。你能帮我瞧一眼？有些数我觉得不对。',
      '下周祈祷的唱诗，你帮我去跟孩子们讲几句吧？他们听你的。',
    ] },
    deep: [
      '当牧师？因为没别的活儿能干。',
      '规训就是纸上的东西。真信的人太少。我也不在乎。',
      '晚上干嘛？祷告看书啰。困了就睡。',
      '小时候差点当矿工。现在想想好笑。',
    ],
    flirt: { low: [

<script>
/* ============ 村庄文游 · 引擎层（第一批） ============ */
/* 状态、节点循环、NPC 并行推演（微事件）、互动结算、存读档 */

const SAVE_KEY = 'village_game_save_v1';

let G = null;

/* ---------- 基础工具 ---------- */
const rnd = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function npcDef(id) { return NPCS.find(n => n.id === id); }
function npcName(id) { const d = npcDef(id); return d ? d.name : id; }

/* NPC 当前节点位置（含动态：Jacob 夜宿钟楼、骑士夜在前线） */
function locOf(def, node) {
  let l = def.loc[node];
  if (node >= DAY_NODES && def.id === 'jacob' && G.nightJacobAtTower) l = 'belltower';
  return l;
}

/* ---------- 开新档 ---------- */
function newGame() {
  G = {
    day: 1, node: 0,
    energy: MAX_ENERGY, coins: 20, force: 5,
    bag: { 弓: 1, 箭矢: 10, 生肉: 3, 旧地图: 1, 铜哨: 1 },
    npc: {}, stars: {},
    feed: [], chronicle: [],
    dayLog: [],            // 今天玩家的行动记录
    flowersPickedDay: 0,
    nightJacobAtTower: false,
    stats: { flowers: 0, chats: 0, teases: 0 },
    starTipShown: false,
  };
  for (const n of NPCS) G.npc[n.id] = { f: n.initF, l: 0, p: 0, last: 1, coldPending: false };
  addFeed('major', '你把家安在了村口以北。第一天，从上午开始。');
  genMorning();
  save();
}

/* ---------- 存读档 ---------- */
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
function hasSave() { return !!localStorage.getItem(SAVE_KEY); }
function load() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return false;
  try { G = JSON.parse(raw); return true; } catch (e) { return false; }
}

/* ---------- 播报流 ---------- */
/* html 里 [[id]] 渲染成可点人名。names 用于星标过滤。 */
function resolveNames(text) {
  return text.replace(/\[\[(\w+)\]\]/g, (_, id) =>
    `<span class="nm" data-npc="${id}">${npcName(id)}</span>`);
}
function extractNames(text) {
  const out = [];
  text.replace(/\[\[(\w+)\]\]/g, (_, id) => { out.push(id); return _; });
  return out;
}
function addFeed(type, text, names) {
  const html = resolveNames(text);
  G.feed.push({ d: G.day, n: G.node, t: type, html, names: names || extractNames(text) });
  if (G.feed.length > 80) G.feed.splice(0, G.feed.length - 80);
}
function visibleFeed() {
  const starred = Object.keys(G.stars).filter(k => G.stars[k]);
  return G.feed.filter(e =>
    e.t === 'major' || e.t === 'you' || e.t === 'morn' ||
    starred.length === 0 || e.names.some(n => starred.includes(n)));
}

/* 你的行动进播报：极简事件句（§8.6），[[id]] 替换成互动对象 */
function youFeed(key, m) {
  const pool = YOU_FEED[key];
  if (!pool || !pool.length) return;
  let t = rnd(pool);
  if (m) {
    if (m.id) t = t.split('[[id]]').join(`[[${m.id}]]`);
    if (m.place) t = t.split('{place}').join(m.place);
    if (m.item) t = t.split('{item}').join(m.item);
  }
  addFeed('you', t);
}

/* ---------- NPC 并行推演（微事件引擎） ---------- */
function npcAt(place, node) {
  return NPCS.filter(n => locOf(n, node) === place).map(n => n.id);
}

function genSimEvents(node) {
  if (node >= DAY_NODES) return;          // 夜间不生成 NPC 街面事件
  const pool = [];
  for (const m of MICRO_EVENTS) {
    if (m.where && npcAt(m.where, node).length === 0) continue;
    const ok = m.need.every(id => locOf(npcDef(id), node) === m.where);
    if (ok) for (const t of m.ev) pool.push(t);
  }
  const count = Math.min(pool.length, 1 + Math.floor(Math.random() * 3)); // 每节点 1-3 条
  const used = new Set();
  for (let i = 0; i < count && pool.length; i++) {
    const t = rnd(pool);
    if (used.has(t) && used.size < pool.length) { i--; continue; }
    used.add(t);
    addFeed('sim', t);
  }
  /* 兜底：共处但没专属事件的二人 */
  if (used.size === 0) {
    const byPlace = {};
    for (const p of ['plaza', 'field', 'bakery', 'library']) {
      const ids = npcAt(p, node);
      if (ids.length >= 2) byPlace[p] = ids;
    }
    const ps = Object.keys(byPlace);
    if (ps.length) {
      const p = rnd(ps), ids = byPlace[p];
      const a = ids[Math.floor(Math.random() * ids.length)];
      let b = a; while (b === a && ids.length > 1) b = rnd(ids);
      const t = rnd(GENERIC_EVENTS).replace(/\[\[a\]\]/g, `[[${a}]]`).replace(/\[\[b\]\]/g, `[[${b}]]`);
      addFeed('sim', t);
    }
  }
}

function genMorning() {
  addFeed('morn', rnd(MORNING_POOL));
  const kn = G.npc.knight;
  if (kn && kn.l >= 60 && G.stats.flowers > 0) {
    addFeed('sim', '[[knight]]胸甲的缝隙里别着一朵花。[[levi]]问起，他说：「她给的。」');
  }
}

/* ---------- 节点推进 ---------- */
function advanceNode() {
  genSimEvents(G.node);                    // 你行动的这个节点里，村里也动了
  G.node++;
  if (G.node >= 5) { settleDay(); return 'settled'; }
  if (G.node === DAY_NODES) nightfall();
  save();
  return 'ok';
}

function nightfall() {
  G.nightJacobAtTower = Math.random() < 0.25;
  if (G.nightJacobAtTower) {
    addFeed('sim', '[[jacob]]修表修过了头，索性睡在钟楼。他说：「齿轮比怪物好懂。」');
  }
}

function settleDay() {
  /* 结算：编年史 + Asher 夜话 + 入夜杂闻 */
  const ash = rnd(npcDef('asher').night);
  const ev = visibleDayEvents();
  G.chronicle.push({
    day: G.day,
    log: G.dayLog.length ? G.dayLog : ['在村里闲逛了一天。'],
    ash, ev,
  });
  addFeed('morn', ash);
  if (G.chronicle.length > 60) G.chronicle.splice(0, G.chronicle.length - 60);
  G.day++; G.node = 0; G.energy = MAX_ENERGY;
  G.dayLog = []; G.flowersPickedDay = 0; G.nightJacobAtTower = false;
  genMorning();
  save();
}

function visibleDayEvents() {
  return G.feed.filter(e => e.d === G.day && e.t === 'sim').map(e => e.html);
}

/* ---------- 关系 ---------- */
function rel(id, key, delta) {
  const s = G.npc[id];
  s[key] = clamp(s[key] + delta, 0, key === 'f' ? 100 : 100);
}
function loveWord(id) {
  const l = G.npc[id].l;
  if (l < 15) return '普通';
  if (l < 35) return '会多看你一眼';
  if (l < 60) return '目光会追随你';
  if (l < 85) return '心里有人';
  return '满心是你';
}
function friendWord(id) {
  const f = G.npc[id].f;
  if (f < 15) return '点头之交';
  if (f < 35) return '熟人';
  if (f < 60) return '朋友';
  if (f < 85) return '好友';
  return '挚交';
}

/* ---------- 互动结算 ---------- */
/* 返回 {lines:[html], feedType} 供 UI 展示；内部处理节点/精力/关系/应激 */
function canDo(costKey) {
  const c = COST[costKey] || 0;
  if (G.energy < c) return '精力不够了。今天先到这。';
  return null;
}

function knightStressRoll(place, aggressive) {
  if (!PLACES[place] || !PLACES[place].outdoor) return null;
  const k = G.npc.knight;
  const base = aggressive ? 0.9 : 0.08 + k.p * 0.003;   // 攻击户外几乎必触发；打闹随占有欲上升
  if (locOf(npcDef('knight'), G.node) === 'front') return null; // 骑士夜在前线
  if (Math.random() < Math.min(base, 0.95)) {
    return aggressive
      ? '剑尖停在你脖子侧面。[[knight]]说：「再动一下试试。」'
      : '广场那头传来[[knight]]的声音：「住手。」';
  }
  return null;
}

/* 台词池取值：支持平铺数组（旧格式）与分档对象（v2 台词库）
   chat 按友情分档（0-30/30-60/60+），flirt 按爱意分档（低<40/中40-75/高75+）；缺档回退 low */
function poolArr(def, type, st) {
  const p = def[type];
  if (Array.isArray(p)) return p;
  if (p && typeof p === 'object') {
    const v = type === 'flirt' ? st.l : st.f;
    const hi = type === 'flirt' ? 75 : 60, mid = type === 'flirt' ? 40 : 30;
    const t = v >= hi ? 'high' : v >= mid ? 'mid' : 'low';
    const arr = (p[t] && p[t].length) ? p[t] : (p.low && p.low.length ? p.low : (p.mid || p.high || []));
    return Array.isArray(arr) ? arr : [];
  }
  return [];
}

function interact(id, type) {
  const def = npcDef(id), st = G.npc[id];
  const err = canDo(type);
  if (err) return { lines: [err], blocked: true };

  const place = locOf(def, G.node);
  const lines = [];
  const daysSince = G.day - st.last;

  /* 冷落/吃醋前置（闲聊和暧昧时冒头） */
  if ((type === 'chat' || type === 'flirt') && st.coldPending && def.cold.length) {
    lines.push(`<b>${def.name}</b>：「${rnd(def.cold)}」`);
    st.coldPending = false;
  } else if ((type === 'chat' || type === 'flirt') && st.l >= 30 && daysSince >= 4 && def.jealous.length) {
    lines.push(`<b>${def.name}</b>：「${rnd(def.jealous)}」`);
  }

  const pool = poolArr(def, type, st);
  if (!pool.length) return { lines: ['现在不适合。'], blocked: true };
  const line = rnd(pool);
  lines.push(`<b>${def.name}</b>：「${line}」`);

  /* 效果 */
  const pname = (PLACES[place] || {}).name || '前线';
  if (type === 'chat') { rel(id, 'f', 2); G.stats.chats++; youFeed('chat', { id, place: pname }); if (Math.random() < 0.15 && def.deep.length && st.f >= 40) {
    lines.push(`<b>${def.name}</b>：「${rnd(def.deep)}」`); rel(id, 'f', 1);
  } }
  if (type === 'flirt') { st.f >= 40 ? (rel(id, 'l', 4), rel(id, 'f', 1), rel(id, 'p', 2)) : rel(id, 'l', 1); youFeed('flirt', { id }); }
  if (type === 'tease') {
    rel(id, 'f', 2); rel(id, 'l', 1); G.stats.teases++; youFeed('tease', { id, place: pname });
    const stress = knightStressRoll(place, false);
    if (stress) {
      lines.push(resolveNames(stress));
      rel('knight', 'f', -2); G.npc.knight.p = clamp(G.npc.knight.p + 1, 0, 100);
      addFeed('sim', `[[knight]]在广场拦下了你和${def.name}的打闹。`);
    }
  }
  if (type === 'hit') {
    rel(id, 'f', -15); st.hitOnce = true;
    lines.push(`你动手了。`);
    const stress = knightStressRoll(place, true);
    if (stress) {
      lines.push(resolveNames(stress));
      rel('knight', 'f', -10);
      addFeed('major', `你在${PLACES[place].name}动手打了${def.name}。[[knight]]的剑出了鞘。`);
    } else {
      addFeed('sim', `你动了手。${def.name}没有声张。`, [id]);
    }
  }

  /* Asher 拆散：你对骑士亲密，且 Asher 同场或在家里 */
  if (id === 'knight' && (type === 'flirt' || type === 'flower') && G.npc.knight.l >= 25 && Math.random() < 0.3) {
    const ashHere = locOf(npcDef('asher'), G.node) === place;
    if (ashHere || G.node >= DAY_NODES) {
      lines.push(`<b>Asher</b>：「Levi 找你搬东西。现在就要。」<span class="dim">他盯着骑士看，不等回答。</span>`);
      rel('asher', 'p', 2);
    }
  }

  st.last = G.day;
  G.energy -= COST[type]; G.dayLog.push(`跟${def.name}${actName(type)}`);
  const adv = advanceNode();
  return { lines, settled: adv === 'settled' };
}

function actName(t) {
  return { chat: '聊了聊', deep: '深聊', flirt: '说了些暧昧话', tease: '打闹', hit: '动了手', trade: '做了笔交易', flower: '送了花' }[t] || t;
}

/* ---------- 骑士：送花 ---------- */
function giveFlower() {
  const err = canDo('flower');
  if (err) return { lines: [err], blocked: true };
  if ((G.bag.花 || 0) < 1) return { lines: ['手里没有花。广场边可以摘。'], blocked: true };
  G.bag.花--;
  const kn = G.npc.knight, def = npcDef('knight');
  const l = kn.l;
  /* 送花反应读台词池 flower 三档（爱≥60高/≥30中/其余低）；旧硬编码仅作无池回退 */
  const fp = def.flower || {};
  const ftier = l >= 60 ? 'high' : l >= 30 ? 'mid' : 'low';
  const farr = (fp[ftier] && fp[ftier].length) ? fp[ftier] : (fp.low && fp.low.length ? fp.low : null);
  const line = farr ? `「${rnd(farr)}」` : (l >= 60 ? '「胸甲这里还有位置。下一朵留着。」' : l >= 30 ? '「又是花。你都送了几次了。我数着。」' : '「花。谢谢。为什么给我。」');
  G.stats.flowers++;
  rel('knight', 'l', 3); rel('knight', 'f', 1); rel('knight', 'p', 1);
  kn.last = G.day;
  const lines = [`你把花递给骑士。`, `<b>骑士</b>：${line}`];
  if (l >= 60) lines.push(resolveNames('第二天早上，[[knight]]胸甲的缝隙里别着那朵花。'));
  youFeed('flower');
  G.energy -= COST.flower; G.dayLog.push('给骑士送了花');
  const adv = advanceNode();
  return { lines, settled: adv === 'settled' };
}

/* ---------- 场所行动 ---------- */
function doPlaceAction(place, act) {
  if (act === 'pickflower') {
    if (G.flowersPickedDay >= 2) return { lines: ['今天的野花摘够了，明天再来。'], blocked: true };
    const err = canDo('pickflower'); if (err) return { lines: [err], blocked: true };
    G.bag.花 = (G.bag.花 || 0) + 1; G.flowersPickedDay++;
    G.energy -= COST.pickflower; G.dayLog.push('在广场边摘了花');
    youFeed('pickflower');
    return { lines: ['你摘了一朵野花。'], settled: advanceNode() === 'settled' };
  }
  if (act === 'water') {
    G.bag.水 = (G.bag.水 || 0) + 1;
    G.dayLog.push('打了水');
    youFeed('water');
    return { lines: ['你打了一桶水。不费什么力气。'], settled: advanceNode() === 'settled' };
  }
  if (act === 'pray') {
    const err = canDo('pray'); if (err) return { lines: [err], blocked: true };
    rel('vivienne', 'f', 1);
    G.energy -= COST.pray; G.dayLog.push('在教堂祈祷');
    youFeed('pray');
    const l = G.npc.vivienne.f >= 40
      ? '「今天为你多念一段。」'
      : '「天主保佑。去忙吧。」';
    return { lines: ['你在教堂坐了一会儿。', `<b>Vivienne</b>：${l}`], settled: advanceNode() === 'settled' };
  }
  if (act === 'study') {
    const err = canDo('study'); if (err) return { lines: [err], blocked: true };
    G.force++; rel('leo', 'f', 1);
    G.energy -= COST.study; G.dayLog.push('在图书馆学习');
    youFeed('study');
    const l = rnd(['「看完了就放回去。」', '「坐里面。里面亮。」', '「这本不适合你。换那本。」']);
    return { lines: [`你看了一上午书。武力 +1（现在 ${G.force}）`, `<b>Leo</b>：${l}`], settled: advanceNode() === 'settled' };
  }
  return { lines: ['（这个动作还没实装）'], blocked: true };
}

/* ---------- 交易 ---------- */
function tradeBuy(id, item, price) {
  if (G.coins < price) return { lines: ['钱不够。'], blocked: true };
  const err = canDo('trade'); if (err) return { lines: [err], blocked: true };
  G.coins -= price;
  G.bag[item] = (G.bag[item] || 0) + (item === '箭矢' ? 5 : 1);
  const def = npcDef(id); rel(id, 'f', 1);
  G.energy -= COST.trade; G.dayLog.push(`从${def.name}那买了${item}`);
  youFeed('buy', { id, item });
  const l = def.easy ? '「拿好。」' : def.hard ? '「钱货两清。」' : '「还要别的吗。」';
  return { lines: [`买到了${item}${item === '箭矢' ? '×5' : ''}（−${price} 安娜币）`, `<b>${def.name}</b>：${l}`], settled: advanceNode() === 'settled' };
}
function tradeSell(id, item, price) {
  if ((G.bag[item] || 0) < 1) return { lines: ['你没有这个。'], blocked: true };
  const err = canDo('trade'); if (err) return { lines: [err], blocked: true };
  G.bag[item]--; if (G.bag[item] <= 0) delete G.bag[item];
  const def = npcDef(id);
  let p = price;
  if (G.npc[id].f >= 60) { p = Math.ceil(price * 1.2); }
  G.coins += p; rel(id, 'f', 1);
  G.energy -= COST.trade; G.dayLog.push(`卖给了${def.name}${item}`);
  youFeed('sell', { id, item });
  const l = G.npc[id].f >= 60 ? '「给你的价，别跟人说。」' : def.easy ? '「下次还拿来。」' : '「嗯。」';
  return { lines: [`卖出了${item}（+${p} 安娜币${p > price ? '，熟人价' : ''}）`, `<b>${def.name}</b>：${l}`], settled: advanceNode() === 'settled' };
}

/* ---------- 冷落计时（每天结算时检查） ---------- */
/* 在 settleDay 里调用于 day++ 之前的数据更新 */
function coldCheck() {
  for (const n of NPCS) {
    const st = G.npc[n.id];
    if (st.f > 20 && G.day - st.last > 6) st.coldPending = true;
  }
}

/* settleDay 包装：先冷落检查再结算 */
const _settleDay = settleDay;
settleDay = function () { coldCheck(); _settleDay(); };

/* ---------- 家：休息/午休 ---------- */
function restNow() {
  const adv = settleDay();
  return { settled: true };
}
function nap() {
  if (G.node !== 1) return { lines: ['只有中午能午休。'], blocked: true };
  if (G.energy >= MAX_ENERGY) return { lines: ['精力是满的。'], blocked: true };
  G.energy = Math.min(MAX_ENERGY, G.energy + 5);
  G.dayLog.push('午休了一会儿');
  youFeed('nap');
  return { lines: [`你睡了半个中午。精力 +5（现在 ${G.energy}）。`], settled: advanceNode() === 'settled' };
}

</script>
<script>
/* ============ 村庄文游 · UI 层（第一批） ============ */

const V = { tab: 'village', place: null, chronDay: null, feedAll: false };

const $ = s => document.querySelector(s);
const app = () => $('#main');

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

/* ---------- 顶栏 ---------- */
function renderStatus() {
  $('#statline').innerHTML =
    `<span class="st">第 ${G.day} 天 · ${NODE_NAMES[G.node]}</span>` +
    `<span class="st">精力 ${G.energy}/${MAX_ENERGY}</span>` +
    `<span class="st">安娜币 ${G.coins}</span>` +
    `<span class="st">武力 ${G.force}</span>`;
}

/* ---------- 播报流 ---------- */
function feedHtml() {
  const all = visibleFeed().slice(-30).reverse();
  const starred = Object.keys(G.stars).some(k => G.stars[k]);
  const hint = starred ? '' : `<div class="feed-hint">在人物界面星标后，这里只显示与TA有关的事。现在显示全部。</div>`;
  if (!all.length) return `<div class="feed-hint">${starred ? '星标的人这段时间没有动静。' : '村里还没有动静。'}</div>`;
  const item = e => {
    const tag = e.t === 'you' ? '<span class="ftag you">你</span>' : e.t === 'major' ? '<span class="ftag major">大事</span>' : '';
    return `<div class="feed ${e.t}"><div class="fmeta">第${e.d}天 ${NODE_NAMES[e.n]}${tag}</div><div class="ftext">${e.html}</div></div>`;
  };
  const shown = V.feedAll ? all : all.slice(0, 6);
  const more = all.length > 6
    ? `<button class="feed-more" data-act="feed-toggle">${V.feedAll ? '收起播报' : `更早的播报 · 还有 ${all.length - 6} 条`}</button>`
    : '';
  return hint + shown.map(item).join('') + more;
}

/* ---------- 村庄页 ---------- */
function villageHtml() {
  if (V.place) return placeHtml(V.place);
  const night = G.node >= DAY_NODES;
  let html = `<div class="sec-title">去哪</div>`;
  if (night) html += `<div class="night-note">夜里村民都在家，屋外只有你和前线的骑士。<br>能去的地方：炼药房（Isabel 睡沙发）${G.nightJacobAtTower ? '、钟楼（Jacob 今夜没回家）' : ''}。</div>`;
  html += `<div class="grid">`;
  for (const [pid, p] of Object.entries(PLACES)) {
    if (pid === 'home') continue;
    const who = NPCS.filter(n => locOf(n, G.node) === pid && (G.node < DAY_NODES || (n.nightStay || n.id === 'jacob' && G.nightJacobAtTower)));
    const label = who.length ? `<span class="pwho">${who.map(n => n.name).join('·')}</span>` : '';
    html += `<button class="cell" data-place="${pid}">${p.name}${label}</button>`;
  }
  html += `</div>`;
  html += `<div class="sec-title" id="feed-sec">播报</div><div class="feed-wrap">${feedHtml()}</div>`;
  return html;
}

function placeHtml(pid) {
  const p = PLACES[pid];
  const who = NPCS.filter(n => locOf(n, G.node) === pid);
  let html = `<button class="back" data-place="">← 村庄</button>`;
  html += `<div class="sec-title">${p.name}</div><div class="place-desc">${p.desc}</div>`;
  let acts = '';
  if (pid === 'plaza') acts += `<button class="btn" data-act="pickflower">摘野花（精力1${G.flowersPickedDay >= 2 ? '·今日已够' : ''}）</button>`;
  if (pid === 'well') acts += `<button class="btn" data-act="water">打水（精力0）</button>`;
  if (pid === 'church' && who.some(n => n.id === 'vivienne')) acts += `<button class="btn" data-act="pray">祈祷（精力1）</button>`;
  if (pid === 'library' && who.some(n => n.id === 'leo')) acts += `<button class="btn" data-act="study">看半天书（精力1·武力+）</button>`;
  if (acts) html += `<div class="actrow2">${acts}</div>`;
  if (!who.length) html += `<div class="dim">这里现在没有人。</div>`;
  else html += who.map(n => npcCard(n)).join('');
  return html;
}

function npcCard(n) {
  const s = G.npc[n.id];
  return `<button class="npc-card" data-npc="${n.id}">
    <span class="nname">${n.name}${G.stars[n.id] ? '<span class="star-mark">★</span>' : ''}</span>
    <span class="njob">${n.job}</span>
    <span class="nrel">${friendWord(n.id)}${s.l >= 15 ? ' · ' + loveWord(n.id) : ''}</span>
  </button>`;
}

/* ---------- 家页 ---------- */
function homeHtml() {
  const s = G.npc.asher;
  let html = `<div class="sec-title">家</div>`;
  html += `<div class="card">
    <div class="row"><b>Gloria</b><span class="dim">猎户·外来者</span></div>
    <div class="dim">精力 ${G.energy}/${MAX_ENERGY} · 武力 ${G.force} · 安娜币 ${G.coins}</div>
    <div class="actrow2">
      ${G.node === 1 && G.energy < MAX_ENERGY ? `<button class="btn" data-act="nap">午休（+5精力）</button>` : ''}
      <button class="btn" data-act="rest">休息（结束今天）</button>
    </div>
  </div>`;
  html += `<div class="sec-title">同住</div>`;
  html += npcCard(npcDef('asher'));
  html += `<div class="dim" style="margin:6px 2px">他白天在图书馆、广场或农田，天黑回来睡第二张床。</div>`;
  html += `<div class="sec-title">背包</div><div class="bag">`;
  for (const [k, v] of Object.entries(G.bag)) {
    html += `<div class="bag-item" data-item="${k}"><b>${k}</b>×${v}<div class="dim">${(ITEMS[k] || {}).d || ''}</div></div>`;
  }
  html += `</div>`;
  return html;
}

/* ---------- 探险页（第二批） ---------- */
function exploreHtml() {
  const zones = [
    ['矿洞', '30%遇怪。铁矿、宝石、黄金玉。近矿安全，远矿富贵。'],
    ['水体', '20%遇怪。钓鱼、潜水。'],
    ['森林', '50%遇怪。木材、水果、蘑菇、稀有花。'],
    ['平原', '绝对安全。打猎、摘花、练剑场。'],
  ];
  let html = `<div class="sec-title">探险</div>`;
  html += `<div class="card"><div class="b">周边还没开放。</div><div class="dim">探险、打猎、采矿、夜战在第二批实装。现在的你能靠广场的花和镇里的买卖过活。</div></div>`;
  html += zones.map(([n, d]) => `<div class="zone"><b>${n}</b><div class="dim">${d}</div><div class="dim">（第二批开放）</div></div>`).join('');
  return html;
}

/* ---------- 设定页 ---------- */
function settingsHtml() {
  let html = `<div class="sec-title">设定</div>`;
  html += `<div class="actrow2">
    <button class="btn" data-act="save">保存</button>
    <button class="btn" data-act="reload">读档</button>
    <button class="btn warn" data-act="newgame">开新档</button>
  </div><div class="dim" style="margin:4px 2px">每个节点自动存档。单存档位。</div>`;
  html += `<div class="sec-title">编年史</div>`;
  if (!G.chronicle.length) html += `<div class="dim">还没有记录。</div>`;
  else html += G.chronicle.slice().reverse().map(c =>
    `<div class="chron" data-chron="${c.day}"><b>第 ${c.day} 天</b><div class="dim">${c.log.slice(0, 2).join('；')}${c.log.length > 2 ? '…' : ''}</div></div>`).join('');
  html += `<div class="sec-title">关于</div><div class="dim" style="margin:2px">村庄 · 第一批（活的村庄）。批二：经济与探险。批三：骑士与结局。批四：血肉。</div>`;
  return html;
}

function chronDetail(day) {
  const c = G.chronicle.find(x => x.day === day);
  if (!c) return;
  let html = `<div class="sec-sub">你做了什么</div>` + c.log.map(l => `<div class="li">· ${l}</div>`).join('');
  html += `<div class="sec-sub">Asher</div><div class="li">${c.ash}</div>`;
  html += `<div class="sec-sub">村里发生了什么</div>`;
  html += c.ev.length ? c.ev.map(e => `<div class="li">${e}</div>`).join('') : `<div class="dim">平静的一天。</div>`;
  openModal(`第 ${c.day} 天`, html);
}

/* ---------- NPC 个人界面 ---------- */
function npcSheet(id) {
  const n = npcDef(id), s = G.npc[id];
  if (!G.starTipShown) {
    G.starTipShown = true;
    toast('星标后，播报只显示与TA有关的事。星标不影响世界运转。');
  }
  const night = G.node >= DAY_NODES;
  let html = `<div class="sheet-head">
    <b class="sheet-name">${n.name}</b>
    <button class="star ${G.stars[id] ? 'on' : ''}" data-act="star" data-id="${id}">${G.stars[id] ? '★ 已星标' : '☆ 星标'}</button>
  </div>`;
  html += `<div class="dim">${n.job}${n.age ? ' · ' + n.age + '岁' : ''} · ${PLACES[locOf(n, G.node)] ? PLACES[locOf(n, G.node)].name : '前线'}</div>`;
  html += `<div class="bio">${n.bio}</div>`;
  if (s.f >= 50) html += `<div class="secret">${n.secretHint}</div>`;
  html += `<div class="relbar"><span>友情 ${friendWord(id)}</span><div class="bar"><div style="width:${s.f}%"></div></div></div>`;
  if (s.l >= 15) html += `<div class="relbar dim">TA好像${loveWord(id)}。</div>`;
  if (id === 'knight') html += `<div class="relbar dim">状态：完好。</div>`;
  /* 互动：基础四人组 2×2；送花/交易等进「更多」 */
  const btn = (t, label, dis) => `<button class="btn ib ${dis ? 'dis' : ''}" data-act="ia" data-id="${id}" data-ia="${t}" ${dis ? 'disabled' : ''}>${label}</button>`;
  html += `<div class="sec-sub">互动</div>`;
  html += `<div class="actrow2">`;
  html += btn('chat', `闲聊（1）`);
  html += btn('flirt', `暧昧（2）`, s.f < 40);
  html += btn('tease', `打闹（2）`);
  if (!n.noAttack) html += btn('hit', '攻击（2）');
  html += `</div>`;
  if (s.f < 40) html += `<div class="dim" style="margin:2px">还不够熟，有些话说不出口。（友情 40 开放暧昧）</div>`;
  let extras = '';
  if (id === 'knight') {
    const noFlower = (G.bag.花 || 0) < 1;
    extras += `<button class="btn line ib ${noFlower ? 'dis' : ''}" data-act="ia" data-id="${id}" data-ia="flower" ${noFlower ? 'disabled' : ''}>送花（1）${noFlower ? '·没花' : ''}</button>`;
  }
  if (n.trade) extras += `<button class="btn line ib" data-act="trade" data-id="${id}">交易（1）</button>`;
  if (extras) html += `<div class="sec-sub">更多</div><div class="actrow2">${extras}</div>`;
  openModal('人物档案', html);
}

function tradeSheet(id) {
  const n = npcDef(id), t = n.trade;
  let html = `<div class="dim">${n.name}的摊子。</div><div class="trade">`;
  html += `<div class="sec-sub">TA 卖</div>`;
  for (const [item, price] of t.sell) html += `<button class="btn tb" data-act="buy" data-id="${id}" data-item="${item}" data-p="${price}">${item}${item === '箭矢' ? '×5' : ''} · ${price}币</button>`;
  html += `<div class="sec-sub">TA 收（你有才显示）</div>`;
  const buys = t.buy.filter(([item]) => (G.bag[item] || 0) > 0);
  html += buys.length ? buys.map(([item, price]) => `<button class="btn tb" data-act="sell" data-id="${id}" data-item="${item}" data-p="${price}">${item}×${G.bag[item]} · ${price}币${G.npc[id].f >= 60 ? '+' : ''}</button>`).join('') : `<div class="dim">你没有TA收的东西。</div>`;
  html += `</div><div class="dim" style="margin-top:6px">关系好的话，收价会往上抬一点。</div>`;
  openModal(`交易 · ${n.name}`, html);
}

/* ---------- 结果弹窗 / 结算 ---------- */
function resultSheet(lines) {
  openModal('　', lines.map(l => `<div class="line">${l}</div>`).join('') + `<div class="actrow2"><button class="btn" data-act="close-res">继续</button></div>`);
}

function settlementSheet() {
  const c = G.chronicle[G.chronicle.length - 1];
  if (!c) return;
  let html = `<div class="sec-sub">第 ${c.day} 天过去了</div>`;
  html += c.log.map(l => `<div class="li">· ${l}</div>`).join('');
  html += `<div class="sec-sub">夜里</div><div class="li">${c.ash}</div>`;
  html += `<div class="actrow2"><button class="btn" data-act="close-res">天亮了</button></div>`;
  openModal('一天结束', html);
}

/* ---------- 弹窗 / toast ---------- */
function openModal(title, html) {
  hideToast();
  $('#modal-title').innerHTML = title;
  $('#modal-body').innerHTML = html;
  $('#modal-mask').classList.add('show');
}
function closeModal() { $('#modal-mask').classList.remove('show'); }
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 2200);
}
function hideToast() { clearTimeout(toastTimer); $('#toast').classList.remove('show'); }

/* ---------- 主渲染 ---------- */
function render() {
  renderStatus();
  $('#tabbar').style.display = '';
  const map = { village: villageHtml, home: homeHtml, explore: exploreHtml, settings: settingsHtml };
  app().innerHTML = map[V.tab]();
  document.querySelectorAll('#tabbar .tab').forEach(el => el.classList.toggle('active', el.dataset.t === V.tab));
  window.scrollTo(0, 0);
}

/* ---------- 事件委托 ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('#tabbar .tab');
  if (tab) { V.tab = tab.dataset.t; V.place = null; closeModal(); render(); return; }

  const nm = e.target.closest('[data-npc]');
  if (nm && !e.target.closest('[data-act]')) { npcSheet(nm.dataset.npc); return; }

  const pl = e.target.closest('[data-place]');
  if (pl) { V.place = pl.dataset.place || null; render(); return; }

  const ch = e.target.closest('[data-chron]');
  if (ch) { chronDetail(+ch.dataset.chron); return; }

  const it = e.target.closest('[data-item]');
  if (it) { toast((ITEMS[it.dataset.item] || {}).d || ''); return; }

  const act = e.target.closest('[data-act]');
  if (!act) {
    if (e.target.id === 'modal-mask' || e.target.closest('#modal-close-btn')) closeModal();
    return;
  }
  const a = act.dataset.act, id = act.dataset.id;
  if (a === 'close-res') { closeModal(); render(); return; }
  if (a === 'feed-toggle') {
    V.feedAll = !V.feedAll; render();
    const f = document.getElementById('feed-sec');
    if (f) f.scrollIntoView({ block: 'start' });
    return;
  }
  if (a === 'star') { G.stars[id] = !G.stars[id]; save(); npcSheet(id); render(); return; }
  if (a === 'trade') { tradeSheet(id); return; }
  if (a === 'ia') {
    if (act.disabled) return;
    const r = interact(id, act.dataset.ia);
    resultSheet(r.lines);
    if (r.settled) setTimeout(settlementSheet, 10);
    else render();
    return;
  }
  if (a === 'buy' || a === 'sell') {
    const r = a === 'buy' ? tradeBuy(id, act.dataset.item, +act.dataset.p) : tradeSell(id, act.dataset.item, +act.dataset.p);
    resultSheet(r.lines);
    if (r.settled) setTimeout(settlementSheet, 10);
    else if (a === 'buy') tradeSheet(id); else { closeModal(); render(); }
    return;
  }
  if (a === 'pickflower' || a === 'water' || a === 'pray' || a === 'study') {
    const r = doPlaceAction(V.place, a);
    resultSheet(r.lines);
    if (r.settled) setTimeout(settlementSheet, 10);
    else render();
    return;
  }
  if (a === 'nap') { const r = nap(); resultSheet(r.lines); if (!r.blocked) render(); return; }
  if (a === 'rest') { restNow(); settlementSheet(); render(); return; }
  if (a === 'save') { save(); toast('已保存。'); return; }
  if (a === 'reload') { if (load()) { V.place = null; closeModal(); render(); toast('已读档。'); } return; }
  if (a === 'newgame') {
    if (confirm('开新档会覆盖现有存档。确定？')) { newGame(); V.place = null; closeModal(); render(); }
    return;
  }
});

/* ---------- 启动 ---------- */
function boot() {
  const saved = hasSave();
  $('#tabbar').style.display = 'none';
  app().innerHTML = `
    <div class="boot">
      <div class="boot-title">村庄</div>
      <div class="boot-sub">西幻中世纪 · 自由向文游</div>
      <div class="boot-box"><div class="boot-txt">
        你是 Gloria，猎户，外来者，把家安在村口以北。<br>
        村里有一位皇帝送的骑士，浑身瓷白，夜里在前线杀怪物。<br>
        白天五个时段，村里人各在各的岗位上。想找谁，就去哪找。<br>
        <span class="dim">每个行动推进一个时段。播报里能看见村里人之间的事。</span>
      </div></div>
      <div class="boot-actions">
        ${saved ? `<button class="btn big" data-boot="continue">继续旅程</button>` : ''}
        <button class="btn big ${saved ? 'warn' : 'gold'}" data-boot="new">${saved ? '新的旅程' : '开始'}</button>
      </div>
      ${saved ? '<div class="boot-note">新的旅程会覆盖旧档</div>' : ''}
    </div>`;
  document.querySelectorAll('[data-boot]').forEach(b => b.onclick = () => {
    if (b.dataset.boot === 'continue') { load(); } else { newGame(); }
    V.tab = 'village'; render();
  });
}
document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
