      <div class="pinfo">
        <div class="pname" id="pname">…</div>
        <div class="statline" id="statline"></div>
      </div>
    </div>
    <div class="actrow">
      <button class="sbtn" id="sb-practice">練劍0/5</button>
      <button class="sbtn gold" id="sb-break">突破</button>
      <button class="sbtn" id="sb-class">大課</button>

    </div>
    <div class="datebar" id="datebar"></div>
    <div class="spiritbar"><div id="spiritfill" style="width:0%"></div></div>
  </div>
  <div id="main"><div class="boot" aria-hidden="true" style="min-height:60dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#f7f1e6,#f2ead9)"><div style="font-size:44px">⛩</div><div style="width:28px;height:2px;background:#8a5a20;margin-top:14px;animation:wjsboot 1.1s ease-in-out infinite"></div><div style="margin-top:10px;font-size:12px;color:#a8916e">翻開手札……</div></div><style>@keyframes wjsboot{0%,100%{opacity:.25}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.boot div{animation:none!important}}</style></div>
  <div id="tabbar">
    <div class="tab active" data-t="xiulian"><span class="ico">⛩</span>修煉</div>
    <div class="tab" data-t="zhujian"><span class="ico">⚒</span>鑄劍</div>
    <div class="tab" data-t="chuxing"><span class="ico">🏔</span>出行</div>
    <div class="tab" data-t="guanxi"><span class="ico">🌸</span>江湖</div>
    <div class="tab" data-t="me"><span class="ico">📜</span>我</div>
  </div>
  <div id="modal-mask">
    <div id="modal">
      <button class="modal-close" id="modal-close-btn">✕</button>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
    </div>
  </div>
</div>
